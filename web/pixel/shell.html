<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bureau</title>
<style>
/* Lot L6: the page of the pixel view. Charte copied from web/index.html, ids of docs/vue-pixel.md 2.10. No remote resource. */
:root{--fond:#1A212E;--panneau:#222B3A;--panneau2:#2A3547;--ligne:#37435A;--ligne2:#4A5875;--texte:#E8ECF2;--doux:#AAB5C8;--lampe:#F0C36A;--ecran:#8FD9C4;--erreur:#E0645A;--bouton:#2E394D;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--texte);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
svg{display:block;flex:none}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--lampe);outline-offset:2px}

/* header */
.barre{display:flex;align-items:center;gap:8px 16px;min-height:48px;padding:6px 14px;background:var(--panneau);border-bottom:1px solid var(--ligne);flex:none;position:relative;z-index:6}
.titre{flex:none;min-width:0;line-height:1.2}
.titre h1{margin:0;font-size:15px;font-weight:600}
.titre p{margin:0;color:var(--doux);font-size:12.5px;white-space:nowrap;min-height:1.2em}
.compteur{flex:1 1 0;min-width:0;display:flex;gap:14px;font-size:13px;color:var(--doux);white-space:nowrap;overflow-x:auto;scrollbar-width:none}
.compteur::-webkit-scrollbar{display:none}
.compteur span{display:inline-flex;align-items:center;gap:6px}
.compteur i{width:8px;height:8px;display:block}
.compteur b{color:var(--texte);font-weight:600;font-variant-numeric:tabular-nums}
.horloge{flex:none;display:flex;align-items:baseline;gap:8px;padding:2px 10px;border-left:1px solid var(--ligne2)}
.horloge b{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1}
.horloge span{color:var(--doux);font-size:12.5px;min-width:52px}
.actions{flex:none;display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:34px;padding:6px 12px;border:1px solid var(--ligne2);border-radius:4px;background:var(--bouton);font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:#38455C}
.btn.plein{background:var(--lampe);border-color:var(--lampe);color:#2A2008}
.btn.plein:hover{background:#F5CF85}
.btn[aria-pressed=true].jaune{background:var(--lampe);border-color:var(--lampe);color:#2A2008}
.btn[aria-pressed=true].jaune .pastille{background:#2A2008;color:var(--lampe)}
.btn[aria-pressed=true]:not(.jaune){background:var(--ecran);border-color:var(--ecran);color:#0F2923}
.btn.danger{color:#F4A39B;border-color:#6A4143;background:transparent}
.btn.danger:hover{background:#3A2A32}
.btn[disabled]{opacity:.5;cursor:default}
.btn.icone{min-height:30px;width:30px;padding:0;background:transparent;border-color:transparent}
.btn.icone:hover{background:var(--panneau2)}
.pastille{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--lampe);color:#2A2008;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.bandeau{flex:none;padding:6px 14px;font-size:12.5px;background:var(--panneau2);color:var(--doux);border-bottom:1px solid var(--ligne);text-align:center}
.bandeau.alerte{background:#3A2A32;color:#F4A39B;border-bottom-color:#6A4143}

/* body: the scene, then the floor bar */
.corps{flex:1;min-height:0;display:flex}
#zone{flex:1;min-width:0;position:relative;background:#0b1020;overflow:hidden}
#scene,#texte{position:absolute;left:0;top:0}
#scene{image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab;touch-action:none}
#scene:focus-visible{outline-offset:-2px}
#scene.drag{cursor:grabbing}
#scene.hand{cursor:pointer}
#texte{pointer-events:none}
.puce{position:absolute;right:10px;top:10px;z-index:3;max-width:70%;padding:7px 11px;background:var(--panneau);border:1px solid var(--ligne);border-radius:4px;pointer-events:none}
.puce b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.puce small{display:block;color:var(--doux);font-size:12px}
.mini{position:absolute;z-index:4;display:flex;align-items:center;gap:2px;padding:3px;background:var(--panneau);border:1px solid var(--ligne);border-radius:4px}
.mini button{min-width:32px;min-height:32px;padding:0 10px;border:0;border-radius:3px;background:transparent;font-size:13px;color:var(--doux)}
.mini button:hover:not([disabled]){background:var(--ligne);color:var(--texte)}
.mini button[disabled]{opacity:.4;cursor:default}
.mini button[aria-pressed=true]{background:var(--ligne);color:var(--texte)}
.mini output{min-width:34px;text-align:center;color:var(--doux);font-variant-numeric:tabular-nums}
#zoom{left:10px;bottom:calc(10px + var(--dh,0px) + var(--jh,0px))}
#pan{left:calc((100% - var(--jr,0px)) / 2);bottom:calc(10px + var(--dh,0px) + var(--jh,0px) + var(--sh,0px));transform:translateX(-50%)}
#dialog{position:absolute;left:0;right:0;bottom:0;z-index:6}
#journal{position:absolute;right:0;top:0;bottom:0;z-index:5;width:min(340px,100%);overflow:auto;background:var(--panneau);border-left:1px solid var(--ligne)}
.vide-scene{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:min(380px,calc(100% - 32px));padding:20px 22px;border:1px solid var(--ligne2);border-radius:6px;background:rgba(34,43,58,.94);text-align:center;pointer-events:none}
.vide-scene h2{margin:0 0 8px;font-size:16px;font-weight:600}
.vide-scene p{margin:0;color:var(--doux)}
.vide-scene code{padding:1px 6px;border-radius:3px;background:var(--panneau2);color:var(--texte);font-size:13px}
#toast{position:absolute;left:50%;top:12px;z-index:12;transform:translateX(-50%);max-width:min(92%,460px);padding:8px 14px;border-radius:4px;background:var(--texte);color:#1A212E;font-size:13.5px;font-weight:500;text-align:center;pointer-events:none;transition:opacity .25s,transform .25s}
#toast[data-v=false]{opacity:0;transform:translate(-50%,-8px)}
#toast.err{background:#F4A39B;color:#2A0F0D}
#infobulle{position:absolute;left:0;top:0;z-index:10;pointer-events:none;max-width:260px;padding:6px 10px;border-radius:4px;background:rgba(20,26,38,.94);border:1px solid var(--ligne2);font-size:12.5px;line-height:1.35}
#infobulle b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#infobulle span{display:block;color:var(--doux);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#infobulle .et{display:flex;align-items:center;gap:6px;color:var(--texte)}
#infobulle .et i{width:8px;height:8px;flex:none;display:block}
#infobulle .lot{color:var(--lampe)}
.pied{position:absolute;right:10px;top:72px;z-index:9;width:290px;max-width:calc(100% - 20px);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;background:var(--panneau);border:1px solid var(--ligne2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.pied label{flex:1 1 100%;color:var(--doux);font-size:13px}
.pied input[type=range]{flex:1 1 100%;width:100%;accent-color:var(--lampe)}
.pied .btn{flex:1 1 0;min-height:30px;padding:3px 10px;font-size:13px}

/* floor bar: a map of the building, one band per floor, a frame for what is on screen, a mark for the cab */
#etages{flex:none;position:relative;width:72px;background:var(--panneau);border-left:1px solid var(--ligne);overflow:hidden}
#etages button{position:absolute;left:0;width:100%;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 0 0 11px;border:0;border-bottom:1px solid var(--ligne);background:transparent;text-align:left}
#etages button:hover{background:#2B3649}
#etages button:focus-visible{outline-offset:-2px}
#etages button::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ligne)}
#etages button.on::before{background:var(--lampe)}
#etages button.cons::before{background:repeating-linear-gradient(135deg,#F0C36A 0 4px,#1A212E 4px 8px)}
#etages .no{font-size:19px;font-weight:650;line-height:1;font-variant-numeric:tabular-nums}
#etages .na{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--l,2);overflow:hidden;font-size:10.5px;line-height:1.15;color:var(--doux);overflow-wrap:anywhere;padding-right:4px}
#etages button.court .na{display:none}
#etages button.on .no{color:var(--lampe)}
#etages button.cons .no{color:var(--doux)}
#etages .dot{position:absolute;right:7px;top:8px;width:8px;height:8px;border-radius:50%;background:var(--lampe);display:none}
#etages button.wait .dot{display:block}
.etages-cadre{position:absolute;left:0;top:0;width:100%;z-index:2;border:2px solid var(--lampe);background:rgba(240,195,106,.08);border-radius:2px;pointer-events:none}
.etages-cabine{position:absolute;right:5px;top:0;z-index:2;width:6px;height:11px;background:var(--ecran);border-radius:1px;pointer-events:none}

/* card: over the scene, top left (a sheet at the bottom on a phone) */
#fiche{position:absolute;left:10px;top:10px;z-index:8;width:330px;max-width:calc(100% - 20px);max-height:calc(100% - 20px - var(--dh,0px));overflow:auto;padding:14px 16px 18px;background:var(--panneau);border:1px solid var(--ligne2);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#fiche h2{margin:0;font-size:16px;font-weight:600;line-height:1.25}
#fiche h2:focus{outline:none}
#fiche p{margin:0}
.tete{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:12px}
.tete canvas{width:72px;height:68px;background:var(--panneau2);border-radius:3px;display:block;image-rendering:pixelated}
.tete .sous{color:var(--doux);font-size:13px}
.tete > div{min-width:0}
.tete h2{overflow-wrap:anywhere}
dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13.5px}
dt{color:var(--doux)}
dd{margin:0;min-width:0;overflow-wrap:anywhere}
dd ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
dd small{display:block;color:var(--doux);font-size:12.5px}
.etat-ligne{display:inline-flex;align-items:center;gap:8px}
.etat-ligne i{width:10px;height:10px;display:block}
.rapport{max-height:150px;overflow:auto;margin:0;padding:8px 10px;border-left:3px solid var(--ligne2);background:var(--panneau2);white-space:pre-wrap;font-size:13px;line-height:1.45}
.question{margin:0 0 12px;padding:8px 10px;border-left:3px solid var(--lampe);background:var(--panneau2);font-size:13.5px}
.question small{display:block;color:var(--doux);font-size:12.5px;margin-bottom:2px}
.question .reste{margin:6px 0 0}
.boutons{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.entete-liste{display:flex;justify-content:space-between;align-items:center}
.liste-attente{display:grid;gap:8px;margin-top:10px}
.liste-attente > p{color:var(--doux)}
.ligne-liste{display:grid;grid-template-columns:minmax(0,1fr);justify-items:start;white-space:normal;gap:2px;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--ligne2);border-left:3px solid var(--lampe);border-radius:4px;background:var(--panneau2)}
.ligne-liste:hover{background:#314058}
.ligne-liste small{color:var(--doux);font-size:12.5px}
.plan .resume{margin:6px 0 4px;color:var(--doux);font-size:13px}
.plan .budget{margin:0 0 10px;color:var(--doux);font-size:12.5px}
.plan table{width:100%;border-collapse:collapse;font-size:13px}
.plan th{text-align:left;font-weight:500;color:var(--doux);padding:4px 6px 6px 0;border-bottom:1px solid var(--ligne)}
.plan td{padding:7px 6px 7px 0;border-bottom:1px solid var(--ligne);vertical-align:top}
.plan td:last-child,.plan th:last-child{padding-right:0}
.plan .a-valider td{color:var(--lampe)}
.plan .sup{display:block;color:var(--doux);font-size:12px}
.plan-pied{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.plan-pied p{color:var(--doux);font-size:12.5px;flex:1 1 180px}
.plan-pied p.ok{color:var(--ecran);font-size:13.5px;font-weight:600}

/* a header that does not fit wraps, the counters take their own row */
@media (max-width:1060px){
  .barre{flex-wrap:wrap}
  .titre{flex:1 1 140px}
  .compteur{order:5;flex:1 1 100%;flex-wrap:wrap;gap:2px 12px;white-space:normal;overflow:visible}
}
/* phone and narrow panel */
@media (max-width:720px){
  .barre{padding:6px 10px;gap:4px 10px}
  .compteur{font-size:12.5px}
  .actions{flex:1 1 100%;flex-wrap:wrap;gap:4px 8px}
  .titre p{display:none}
  .horloge{border-left:0;padding:0}
  .horloge span{display:none}
  .horloge b{font-size:17px}
  .btn{padding:4px 10px;font-size:13px}
  #etages{width:44px}
  #etages button{padding-left:9px}
  #etages .no{font-size:16px}
  #etages .na{display:none}
  #etages .dot{right:5px;top:6px;width:7px;height:7px}
  .puce{display:none}
  #zoom{left:auto;right:8px;top:8px;bottom:auto}
  #toast{top:auto;bottom:64px;max-width:calc(100% - 24px)}
  #toast[data-v=false]{transform:translate(-50%,8px)}
  .pied{left:8px;right:8px;top:56px;width:auto}
  #journal{top:auto;left:0;right:0;bottom:0;width:auto;height:42%;border-left:0;border-top:1px solid var(--ligne)}
  #fiche{left:0;right:0;top:auto;bottom:calc(var(--dh,0px) + var(--jh,0px));width:auto;max-width:none;max-height:46dvh;border-width:1px 0 0 0;border-radius:12px 12px 0 0;padding:12px 14px 0;overscroll-behavior:contain;scroll-padding-bottom:104px}
  /* the details scroll, the row of buttons stays stuck at the foot of the sheet */
  #fiche .boutons{position:sticky;bottom:0;z-index:1;margin:12px -14px 0;padding:10px 14px 12px;background:var(--panneau);border-top:1px solid var(--ligne)}
  #fiche .boutons .btn{flex:1 1 auto}
  .tete{margin-bottom:8px}
  .question{margin-bottom:8px}
  .rapport{max-height:96px}
  #pPlan .plan-pied{position:sticky;bottom:0;margin:12px -14px 0;padding:10px 14px 12px;background:var(--panneau);border-top:1px solid var(--ligne)}
  dl{grid-template-columns:84px 1fr;gap:6px 12px}
}
@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
}
</style>
</head>
<body>

<header class="barre" id="entete">
  <div class="titre">
    <h1>Bureau</h1>
    <p id="sous"></p>
  </div>
  <div class="compteur" id="compteur" role="group" aria-label="Compteur des agents"></div>
  <div class="horloge" role="group" aria-label="Heure du bureau">
    <b id="hh">00:00</b><span id="phase">Nuit</span>
  </div>
  <div class="actions">
    <button class="btn jaune" id="bAttente" type="button" aria-pressed="false">
      Qui m’attend
      <span class="pastille" id="nAttente" hidden></span>
    </button>
    <button class="btn" id="bPlan" type="button" aria-pressed="false" hidden>Plan de mission</button>
    <button class="btn" id="bVueAvancee" type="button" aria-pressed="false" hidden>Vue avancée</button>
    <button class="btn" id="bPlanTech" type="button" aria-pressed="false" hidden>Plan technique</button>
    <button class="btn" id="bDemo" type="button" aria-pressed="false" aria-expanded="false" aria-controls="pied" hidden>Démo</button>
  </div>
</header>
<div class="bandeau" id="bandeau" role="status" hidden></div>

<div class="corps">
  <main id="zone">
    <canvas id="scene" tabindex="0" aria-label="L’immeuble, étage par étage. Molette ou glisser pour monter et descendre, flèches haut et bas pour changer d’étage, clic sur un personnage pour sa fiche."></canvas>
    <canvas id="texte" aria-hidden="true"></canvas>
    <div class="puce" id="puce" hidden><b></b><small></small></div>
    <div class="mini" id="zoom" role="group" aria-label="Zoom">
      <button id="zOut" type="button" aria-label="Dézoomer">-</button><output id="zVal" aria-live="off">×2</output><button id="zIn" type="button" aria-label="Zoomer">+</button>
    </div>
    <div class="mini" id="pan" role="group" aria-label="Déplacer la vue vers l’escalier, l’étage ou l’ascenseur" hidden>
      <button type="button" data-stop="stairs" aria-pressed="false">Escalier</button>
      <button type="button" data-stop="floor" aria-pressed="true">Étage</button>
      <button type="button" data-stop="lift" aria-pressed="false">Ascenseur</button>
    </div>
    <div id="dialog" hidden></div>
    <div id="journal" hidden></div>
    <div class="vide-scene" id="videScene" hidden></div>
    <div id="infobulle" role="tooltip" hidden></div>
    <div id="toast" role="status" aria-live="polite" data-v="false"></div>
    <aside id="fiche" aria-label="Fiche de l’agent" hidden>
      <section id="pListe" hidden aria-labelledby="listeTitre">
        <div class="entete-liste">
          <h2 id="listeTitre" tabindex="-1">Ils t’attendent</h2>
          <button class="btn icone" type="button" data-fermer aria-label="Fermer la liste"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="liste-attente" id="listeAttente"></div>
      </section>

      <section id="pDetail" hidden aria-labelledby="dNom">
        <div class="tete">
          <canvas id="portrait" width="72" height="68" aria-hidden="true"></canvas>
          <div>
            <h2 id="dNom" tabindex="-1"></h2>
            <p class="sous" id="dRole"></p>
          </div>
          <button class="btn icone" type="button" data-fermer aria-label="Fermer la fiche"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <div class="question" id="dQuestion" hidden><small>Il attend</small><span id="dQuestionTexte"></span><small class="reste">La réponse se fait dans Boite : « Répondre » ouvre sa conversation.</small></div>
        <dl>
          <dt>Service</dt><dd id="dService"></dd>
          <dt>Supérieur</dt><dd id="dSup"></dd>
          <dt>Modèle</dt><dd id="dModele"></dd>
          <dt>État</dt><dd><span class="etat-ligne"><i id="dPastille"></i><span id="dEtat"></span></span></dd>
          <dt>Depuis</dt><dd id="dDepuis"></dd>
          <dt>Fichiers</dt><dd><ul id="dFichiers"></ul></dd>
          <dt>Dernier rapport</dt><dd id="dRapport"></dd>
        </dl>
        <div class="boutons">
          <button class="btn" id="bConv" type="button">Ouvrir la conversation</button>
          <button class="btn plein" id="bRep" type="button" hidden>Répondre</button>
          <button class="btn danger" id="bStop" type="button" hidden>Arrêter</button>
        </div>
      </section>

      <section id="pPlan" class="plan" hidden aria-labelledby="planTitre">
        <div class="entete-liste">
          <h2 id="planTitre" tabindex="-1">Plan de mission</h2>
          <button class="btn icone" type="button" data-fermer aria-label="Fermer le plan"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <p class="resume" id="planResume"></p>
        <p class="budget" id="planBudget"></p>
        <table>
          <thead><tr><th scope="col">Lot et agent</th><th scope="col">Modèle</th><th scope="col">État</th></tr></thead>
          <tbody id="planCorps"></tbody>
        </table>
        <div class="plan-pied">
          <button class="btn plein" id="bValider" type="button" hidden>Valider le plan</button>
          <p id="planNote"></p>
        </div>
      </section>
    </aside>
    <div class="pied" id="pied" hidden>
      <label for="rHeure">Heure (démo)</label>
      <input type="range" id="rHeure" min="0" max="1439" step="1" value="0" aria-label="Heure de la journée">
      <button class="btn" id="bReel" type="button" aria-pressed="true">Heure réelle</button>
      <button class="btn" id="bJour" type="button" aria-pressed="false">Jour en 30 s</button>
    </div>
  </main>
  <nav id="etages" aria-label="Étages de l’immeuble : un clic centre l’étage"></nav>
</div>

<!-- scripts -->
</body>
</html>
