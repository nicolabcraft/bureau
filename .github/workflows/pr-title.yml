name: titre de la PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  titre:
    name: Titre de la PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Vérifier le format du titre
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|test|ci|build|chore|revert)(\([a-z0-9-]+\))?!?: .+'; then
            echo "::error::Le titre doit suivre « type: résumé » (types : feat, fix, perf, refactor, docs, test, ci, build, chore, revert), par exemple « fix: la porte du chef reste ouverte »."
            exit 1
          fi
