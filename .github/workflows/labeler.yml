name: étiquettes

# pull_request_target lance le workflow et la configuration de la branche de base :
# une PR d'un fork reçoit ses étiquettes sans que son code soit jamais récupéré ici.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  etiqueter:
    name: Étiqueter la PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
