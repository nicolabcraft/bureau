version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dépendances]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    labels: [dépendances]
    commit-message:
      prefix: chore
    groups:
      # Les mises à jour mineures et correctifs arrivent ensemble, une majeure par PR.
      dependances:
        patterns: ['*']
        update-types: [minor, patch]
